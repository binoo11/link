<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <!-- FontAwesome 6 for Official Brand Logos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Layout Container */
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* Profile Section */
        .profile {
            margin-bottom: 30px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 12px;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Links Container */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Link Buttons Base Style */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .link-btn i {
            font-size: 1.4rem;
        }

        /* Hover animation */
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            color: #ffffff;
        }

        /* Official Brand Icon Colors */
        .fa-globe { color: #38bdf8; }
        .fa-facebook { color: #1877F2; }
        .fa-instagram { color: #E4405F; }
        .fa-whatsapp { color: #25D366; }

        /* Brand Color Hover Effects */
        .link-btn.facebook:hover {
            background-color: #1877F2;
            border-color: #1877F2;
        }
        .link-btn.facebook:hover i { color: #ffffff; }

        .link-btn.instagram:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-color: transparent;
        }
        .link-btn.instagram:hover i { color: #ffffff; }

        .link-btn.whatsapp:hover {
            background-color: #25D366;
            border-color: #25D366;
        }
        .link-btn.whatsapp:hover i { color: #ffffff; }

        .link-btn.website:hover {
            background-color: #38bdf8;
            border-color: #38bdf8;
            color: #0f172a;
        }
        .link-btn.website:hover i { color: #0f172a; }

        /* Footer */
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Profile Section -->
        <header class="profile">
            <img src="assets/logo.png" alt="Profile Picture" class="profile-img">
            <h1 class="profile-name"> Unicom Solutions</h1>
        </header>

        <!-- Links Section -->
        <div class="links-container">
            <!-- Website Link -->
            <a href="https://unicomsolutions.com.np/" target="_blank" rel="noopener noreferrer" class="link-btn website">
                <i class="fa-solid fa-globe"></i>
                <span>Official Website</span>
            </a>

            <!-- Facebook Link -->
            <a href="https://facebook.com/yourpage" target="_blank" rel="noopener noreferrer" class="link-btn facebook">
                <i class="fa-brands fa-facebook"></i>
                <span>Facebook</span>
            </a>

            <!-- Instagram Link -->
            <a href="https://instagram.com/yourhandle" target="_blank" rel="noopener noreferrer" class="link-btn instagram">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
            </a>

            <!-- WhatsApp Direct Link (Replace 1234567890 with country code + your phone number) -->
            <a href="https://wa.me/1234567890" target="_blank" rel="noopener noreferrer" class="link-btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>Chat on WhatsApp</span>
            </a>
        </div>

        <!-- Footer -->
        <footer>
            <p>© 2026 Unicomsolutions. All rights reserved.</p>
        </footer>
    </main>

</body>
</html>
